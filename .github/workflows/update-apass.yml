name: Update APASS DR9 photometry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-apass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalogue-query dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astropy astroquery numpy

      - name: Query APASS DR9 and update data files
        run: python scripts/update_apass_dr9.py

      - name: Show changes
        run: git diff -- data/fields.json data/reference-stars.csv

      - name: Commit updated APASS photometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fields.json data/reference-stars.csv
          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
          else
            git commit -m "Add APASS DR9 multiband photometry"
            git push
          fi
